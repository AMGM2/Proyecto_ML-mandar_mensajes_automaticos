<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avisos de envío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #2A3547;
    --paper: #F3EFE4;
    --paper-line: #DCD5C2;
    --text-dark: #2A2620;
    --text-mute: #6B6455;
    --postmark: #2F5EA8;
    --postmark-soft: #E7EDF7;
    --stamp-red: #C1442D;
    --sent-green: #3E6B52;
    --sent-green-soft: #E4EEE8;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, var(--ink-soft) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, var(--ink-soft) 0%, transparent 45%);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--text-dark);
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
  }

  header {
    text-align: left;
    margin-bottom: 32px;
    padding: 0 4px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8FA4C7;
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Special Elite', monospace;
    font-weight: 400;
    font-size: 30px;
    color: #F3EFE4;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }

  header p {
    color: #9AA5B8;
    margin: 0;
    font-size: 15px;
    max-width: 46ch;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 700px) {
    .board { grid-template-columns: 1fr; }
  }

  .label-card {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 22px 22px 20px;
    position: relative;
    box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    border: 1px solid rgba(0,0,0,0.06);
  }

  .label-card::before {
    content: "";
    position: absolute;
    top: 0; left: 24px; right: 24px;
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--paper-line) 0 6px, transparent 6px 12px);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .carrier {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .carrier-icon {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
  }

  .carrier-icon.correo { background: #E7EDF7; color: var(--postmark); }
  .carrier-icon.flex { background: #FBEAE5; color: var(--stamp-red); }

  .carrier-name {
    font-weight: 700;
    font-size: 16px;
    color: var(--text-dark);
    margin: 0;
  }

  .carrier-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-mute);
    margin: 2px 0 0;
  }

  .count-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .count-chip.correo { background: var(--postmark-soft); color: var(--postmark); }
  .count-chip.flex { background: #FBEAE5; color: var(--stamp-red); }

  ul.orders {
    list-style: none;
    margin: 0 0 18px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
  }

  ul.orders li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 9px 10px;
    background: #FFFFFF;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    font-size: 13.5px;
  }

  ul.orders li .buyer {
    font-weight: 600;
    color: var(--text-dark);
  }

  ul.orders li .order-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-mute);
  }

  .send-btn {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 15px 18px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .send-btn.correo { background: var(--postmark); color: white; }
  .send-btn.flex { background: var(--stamp-red); color: white; }

  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.18); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { cursor: default; transform: none; box-shadow: none; }

  .send-btn.sent {
    background: var(--sent-green-soft);
    color: var(--sent-green);
  }

  .empty-state {
    text-align: center;
    padding: 28px 10px;
    color: var(--text-mute);
    font-size: 13.5px;
  }

  /* Stamp animation */
  .stamp-wrap {
    position: absolute;
    top: 14px;
    right: 18px;
    pointer-events: none;
    opacity: 0;
    transform: scale(2.2) rotate(-18deg);
  }

  .stamp-wrap.show {
    animation: stampIn 0.45s cubic-bezier(.2,.9,.3,1.3) forwards;
  }

  @keyframes stampIn {
    0%   { opacity: 0; transform: scale(2.6) rotate(-18deg); }
    60%  { opacity: 1; transform: scale(0.92) rotate(-10deg); }
    100% { opacity: 1; transform: scale(1) rotate(-10deg); }
  }

  .stamp-badge {
    font-family: 'Special Elite', monospace;
    font-size: 12px;
    color: var(--sent-green);
    border: 2px solid var(--sent-green);
    border-radius: 6px;
    padding: 3px 9px;
    letter-spacing: 0.06em;
    background: rgba(228,238,232,0.9);
  }

  .footnote {
    margin-top: 22px;
    text-align: center;
    color: #7C879C;
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp-wrap.show { animation: none; opacity: 1; transform: scale(1) rotate(-10deg); }
    .send-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Hoy · 18 de agosto</p>
    <h1>Avisos de envío</h1>
    <p>Estos son los pedidos despachados hoy. Tocá el botón para avisarle a cada comprador que su paquete ya salió.</p>
  </header>

  <div class="board" id="board"></div>

  <p class="footnote">Los mensajes se mandan por el chat de Mercado Libre, uno por comprador.</p>
</div>

<script>
  const data = {
    correo: {
      name: "Correo",
      sub: "envío a domicilio o sucursal",
      icon: "C",
      cls: "correo",
      orders: [
        { buyer: "Marina Sosa", id: "#2200145198231" },
        { buyer: "Julián Ferreyra", id: "#2200145201884" },
        { buyer: "Rocío Bazán", id: "#2200145203010" },
        { buyer: "Ezequiel Toledo", id: "#2200145204477" },
      ],
    },
    flex: {
      name: "Flex",
      sub: "entrega el mismo día",
      icon: "FX",
      cls: "flex",
      orders: [
        { buyer: "Camila Núñez", id: "#2200145198590" },
        { buyer: "Pedro Villalba", id: "#2200145199902" },
        { buyer: "Agustina Ríos", id: "#2200145202230" },
      ],
    },
  };

  const board = document.getElementById('board');

  function ordersListHTML(orders) {
    if (!orders.length) {
      return `<div class="empty-state">No hay despachos de este tipo hoy todavía.</div>`;
    }
    return `<ul class="orders">${orders.map(o => `
      <li>
        <span class="buyer">${o.buyer}</span>
        <span class="order-id">${o.id}</span>
      </li>`).join('')}</ul>`;
  }

  function cardHTML(key, group) {
    const count = group.orders.length;
    return `
      <div class="label-card" id="card-${key}">
        <div class="stamp-wrap" id="stamp-${key}">
          <span class="stamp-badge">ENVIADO ✓</span>
        </div>
        <div class="card-top">
          <div class="carrier">
            <div class="carrier-icon ${group.cls}">${group.icon}</div>
            <div>
              <p class="carrier-name">${group.name}</p>
              <p class="carrier-sub">${group.sub}</p>
            </div>
          </div>
          <div class="count-chip ${group.cls}">${count} despachado${count === 1 ? '' : 's'}</div>
        </div>
        ${ordersListHTML(group.orders)}
        <button class="send-btn ${group.cls}" id="btn-${key}" ${count === 0 ? 'disabled' : ''} onclick="sendMessages('${key}')">
          Mandar mensajes de ${group.name}
        </button>
      </div>
    `;
  }

  function render() {
    board.innerHTML = Object.entries(data).map(([key, group]) => cardHTML(key, group)).join('');
  }

  function sendMessages(key) {
    const btn = document.getElementById(`btn-${key}`);
    const stamp = document.getElementById(`stamp-${key}`);
    const count = data[key].orders.length;

    btn.disabled = true;
    btn.textContent = 'Mandando...';

    // Simula el envío real (acá va la llamada a la API)
    setTimeout(() => {
      btn.textContent = `Mensajes enviados a ${count} comprador${count === 1 ? '' : 'es'}`;
      btn.classList.add('sent');
      stamp.classList.add('show');
    }, 700);
  }

  render();
</script>

</body>
</html>
